# Promotion moves an already-built, already-attested digest to the next environment. It never builds.
# The `environment` below carries the approval rule (required reviewers on production).
# The last step opens a pull request against school-gitops with these digests. Git is the record of what runs where;
# Argo CD deploys when that pull request merges (production still needs a manual sync and CODEOWNERS approval).
name: promote

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, staging, production]
        required: true
      backend_digest:
        description: "Backend image digest (sha256:...)"
        required: true
      frontend_digest:
        description: "Frontend image digest (sha256:...)"
        required: true

permissions:
  contents: read

jobs:
  verify-and-promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/release.yml
    steps:
      - name: Authenticate to AWS (OIDC, read-only role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PULL_ROLE_ARN }} # trust policy is bound to this GitHub environment
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # Verify on consumption: the attestation must belong to this exact digest AND come from our repo
      # and our release workflow. A scan result or a tag proves none of that.
      - name: Verify provenance of both digests
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          BACKEND: ${{ inputs.backend_digest }}
          FRONTEND: ${{ inputs.frontend_digest }}
        run: |
          set -euo pipefail
          for ref in "school-backend@${BACKEND}" "school-frontend@${FRONTEND}"; do
            gh attestation verify "oci://${REGISTRY}/${ref}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${SIGNER_WORKFLOW}"
          done

      - name: Record the promotion
        env:
          TARGET: ${{ inputs.environment }}
          BACKEND: ${{ inputs.backend_digest }}
          FRONTEND: ${{ inputs.frontend_digest }}
        run: |
          {
            echo "### Promoted to ${TARGET}"
            echo "- backend: \`${BACKEND}\`"
            echo "- frontend: \`${FRONTEND}\`"
            echo "- approved via GitHub Environment \`${TARGET}\`; run ${GITHUB_RUN_ID}, actor ${GITHUB_ACTOR}"
          } >> "$GITHUB_STEP_SUMMARY"

      # A GitHub App token scoped to ONE repository, valid for one hour. No personal access token, no long-lived secret.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: school-gitops

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/school-gitops
          token: ${{ steps.app-token.outputs.token }}
          path: gitops

      - name: Open the promotion pull request
        working-directory: gitops
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET: ${{ inputs.environment }}
          BACKEND: ${{ inputs.backend_digest }}
          FRONTEND: ${{ inputs.frontend_digest }}
        run: |
          set -euo pipefail
          branch="promote/${TARGET}-${GITHUB_RUN_ID}"
          python3 scripts/set_image.py "$TARGET" --backend "$BACKEND" --frontend "$FRONTEND"
          git config user.name "school-promotion[bot]"
          git config user.email "school-promotion[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore(${TARGET}): promote ${BACKEND:0:19} / ${FRONTEND:0:19}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Promote to ${TARGET}" \
            --body "Digests verified against the release workflow's provenance in ${GITHUB_REPOSITORY}, run ${GITHUB_RUN_ID}, requested by ${GITHUB_ACTOR}.

          - backend: \`${BACKEND}\`
          - frontend: \`${FRONTEND}\`"
